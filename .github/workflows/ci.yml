name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build · Publint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changeset 守卫需与 base 比对

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # 显式指定 pnpm 缓存。setup-node v6 起「自动缓存」只认 npm,
          # 本仓 packageManager 是 pnpm,不写这行就不会缓存。
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: 展示站红线 (props.json 未漂移 + 新组件有覆盖)
        run: pnpm check:docs

      - name: Registry 索引校验
        run: pnpm registry

      - name: manifest.json 必须已提交最新结果
        run: git diff --exit-code registry/manifest.json

      - name: docs 构建 (VitePress,含死链校验;用生产 base,提前暴露子路径问题)
        run: pnpm docs:build
        env:
          DOCS_BASE: /magic-scope/docs/

      - name: docs 红线 (生成物与 meta/props/manifest 同步且已提交)
        run: |
          # docs:build 已内嵌 pnpm gen:docs 重新生成 —— 此处只判定不再生成,保证判定对象=构建产物。
          # 不能直接 git diff --exit-code:默认 shell 带 -e,diff 一红 step 即死,下面的修复指引永远打不出来。
          if ! git diff --quiet -- docs || [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::docs 生成物与真相源不同步 —— 改了组件 meta / props / manifest 的分支,请本地运行 pnpm gen:docs 并提交 docs/ 变更:"
            git --no-pager diff --stat -- docs
            git status --porcelain -- docs
            exit 1
          fi

      - name: docs 渲染红线 (结构完整 + 无转义/强调符渲染瑕疵)
        run: pnpm check:docs-render

      - name: 包发布质量 (publint)
        run: |
          npx -y publint packages/tokens
          npx -y publint packages/react

      - name: 类型导出正确性 (are-the-types-wrong)
        run: |
          # 忽略 no-resolution:CSS 导出无类型、node10 不支持 exports 子路径,均为已知误报;
          # JS 入口的 false-esm / cjs-resolves-to-esm 等真问题仍会拦截。
          npx -y @arethetypeswrong/cli --pack packages/tokens --ignore-rules no-resolution
          npx -y @arethetypeswrong/cli --pack packages/react --ignore-rules no-resolution

      - name: 包体积守卫 (gzip)
        run: pnpm size

      - name: changeset 守卫 (改发布包应有 changeset)
        if: github.event_name == 'pull_request'
        run: |
          # checkout 已 fetch-depth:0 全量拉取,勿再 --depth=1 浅 fetch(会引入 shallow 边界破坏 merge-base 计算)
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)
          if echo "$CHANGED" | grep -qE '^packages/(tokens|react)/(src/|package\.json)' \
            && ! echo "$CHANGED" | grep -qE '^\.changeset/.+\.md$'; then
            echo "::warning::改动了发布包但没有新 changeset。面向用户的改动请运行 pnpm changeset。"
          fi
